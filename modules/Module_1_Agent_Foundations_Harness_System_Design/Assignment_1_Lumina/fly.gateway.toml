# fly.toml app configuration file generated for lumina-gateway-hoyinwan on 2026-09-17T20:28:05-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lumina-gateway-hoyinwan'
primary_region = 'iad'

[build]
  dockerfile = 'backend/gateway/Dockerfile'

[env]
  PORT_GATEWAY = '8787'
  AGENT_URL = 'http://lumina-agent-hoyinwan.internal:8000'
  CORS_ORIGINS = 'http://localhost:5173,https://hw-lumina-beta.vercel.app'
  RATE_LIMIT_PER_MINUTE = '300'
  LOG_LEVEL = 'info'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
